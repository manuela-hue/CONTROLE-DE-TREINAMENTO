<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cronograma de treinamento da expedição</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="appcss">
:root{
  --roxo:#8250FA;--agua:#1E96AA;
  --bg:#F6F5FB;--surface:#FFFFFF;--surface2:#F0EDFA;--ink:#1D1A2E;--muted:#615C78;--line:#E2DEF0;
  --ok:#1E8A5A;--okbg:#E3F5EC;--warn:#B26A00;--warnbg:#FFF2DC;--bad:#C2363F;--badbg:#FCE6E7;
  --roxobg:#EEE7FF;--aguabg:#DFF3F6;
  color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#15131F;--surface:#1F1C2D;--surface2:#29253B;--ink:#EFEDF7;--muted:#A9A4C0;--line:#363149;
  --ok:#5AD39A;--okbg:#173327;--warn:#F2B45A;--warnbg:#3A2B12;--bad:#F27A82;--badbg:#3D1B1F;
  --roxo:#A585FF;--agua:#4CC2D4;--roxobg:#2D2448;--aguabg:#163238;color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#15131F;--surface:#1F1C2D;--surface2:#29253B;--ink:#EFEDF7;--muted:#A9A4C0;--line:#363149;
  --ok:#5AD39A;--okbg:#173327;--warn:#F2B45A;--warnbg:#3A2B12;--bad:#F27A82;--badbg:#3D1B1F;
  --roxo:#A585FF;--agua:#4CC2D4;--roxobg:#2D2448;--aguabg:#163238;color-scheme:dark;}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-size:15px;line-height:1.5}
.wrap{max-width:1100px;margin:0 auto;padding:28px 20px 60px}
h1{font-size:28px;line-height:1.2;font-weight:800;margin:0 0 6px;letter-spacing:-.01em}
h2{font-size:19px;font-weight:700;margin:0 0 4px}
.sub{color:var(--muted);margin:0}
section{margin-top:36px}
.sechead{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--roxo);outline-offset:2px}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;font-weight:600}
.btn:hover{border-color:var(--roxo)}
.btn.primary{background:var(--roxo);border-color:var(--roxo);color:#fff}
.btn.small{padding:5px 10px;font-size:13px}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}

/* Cabeçalho: cadeia expedidor → condutores */
.chain{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:0;align-items:center;margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.who{display:flex;flex-direction:column;gap:2px}
.who .role{font-size:12.5px;color:var(--muted);font-weight:600}
.who .name{font-size:18px;font-weight:700}
.who .unit{font-size:13px;color:var(--muted)}
.arrow{width:70px;height:2px;background:linear-gradient(90deg,var(--roxo),var(--agua));margin:0 18px;position:relative}
.arrow::after{content:"";position:absolute;right:-1px;top:-4px;border:5px solid transparent;border-left:7px solid var(--agua);border-right:0}
.trainees{display:flex;flex-direction:column;gap:8px}
.tr{display:flex;align-items:center;gap:10px}
.dot{width:10px;height:10px;border-radius:50%;flex:none}
.c0 .dot,.dot.c0{background:var(--roxo)} .c1 .dot,.dot.c1{background:var(--agua)}
.edit-link{background:none;border:0;padding:0;color:var(--roxo);font-weight:600;font-size:13px;margin-top:10px;align-self:flex-start}

/* Painéis por condutor */
.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px;border-top:4px solid var(--roxo)}
.panel.c1{border-top-color:var(--agua)}
.panel h3{margin:0 0 12px;font-size:16px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.kpi .v{font-size:24px;font-weight:800;line-height:1.1}
.kpi .l{font-size:12.5px;color:var(--muted)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-top:14px}
.bar i{display:block;height:100%;background:var(--roxo);border-radius:99px}
.panel.c1 .bar i{background:var(--agua)}
.barlabel{font-size:12.5px;color:var(--muted);margin-top:6px}

/* Formulário */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 16px}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f.span2{grid-column:span 2}.f.span4{grid-column:1/-1}
label,.lab{font-size:13px;font-weight:600}
.hint{font-weight:400;color:var(--muted)}
input[type=text],input[type=date],input[type=time],select,textarea{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:8px;padding:9px 11px}
textarea{min-height:76px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:99px;padding:6px 12px;font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--roxobg);border-color:var(--roxo);color:var(--roxo);font-weight:600}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:var(--bg);padding:8px 12px;border-right:1px solid var(--line);font-size:14px}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--roxo);color:#fff;font-weight:600}
.notas button{min-width:38px;padding:8px 0}
.formfoot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:18px;flex-wrap:wrap}
.err{color:var(--bad);font-size:13.5px;font-weight:500}

/* Matriz de prontidão */
.matrix-wrap{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:14px}
table{border-collapse:collapse;width:100%;min-width:560px}
th,td{text-align:left;padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
th{font-size:12.5px;color:var(--muted);font-weight:600;background:var(--surface2)}
tr:last-child td{border-bottom:0}
.st{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:3px 10px;border-radius:99px}
.st.apto{background:var(--okbg);color:var(--ok)}
.st.reforco{background:var(--warnbg);color:var(--warn)}
.st.nao{background:var(--surface2);color:var(--muted);font-weight:500}
.st small{font-weight:500;opacity:.85}

/* Histórico */
.filters{display:flex;gap:8px;flex-wrap:wrap}
.day{margin-top:18px}
.dayhead{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 8px;padding-left:2px}
.entry{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--roxo);border-radius:10px;padding:14px 16px;margin-bottom:10px}
.entry.c1{border-left-color:var(--agua)}
.etop{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.etitle{font-weight:700;font-size:15.5px}
.emeta{font-size:13px;color:var(--muted)}
.edl{display:grid;grid-template-columns:150px 1fr;gap:6px 14px;margin:12px 0 0;font-size:14px}
.edl dt{color:var(--muted);font-weight:600;font-size:13px}
.edl dd{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.nota{display:inline-block;font-weight:800;padding:1px 8px;border-radius:6px}
.nota.hi{background:var(--okbg);color:var(--ok)}.nota.mid{background:var(--warnbg);color:var(--warn)}.nota.lo{background:var(--badbg);color:var(--bad)}
.eact{display:flex;gap:8px;margin-top:12px}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:26px;text-align:center;color:var(--muted)}

.notice{background:var(--aguabg);color:var(--ink);border-radius:10px;padding:10px 14px;font-size:13.5px;margin-top:16px}
.notice.ro{background:var(--warnbg)}
.sync{display:flex;align-items:flex-start;gap:10px;margin-top:14px;padding:10px 14px;border-radius:10px;font-size:13.5px}
.sync strong{display:block;font-weight:700}
.sync span:not(.sdot){color:var(--muted);font-size:12.5px}
.sdot{width:10px;height:10px;border-radius:50%;flex:none;margin-top:5px}
.sync.ok{background:var(--okbg)}.sync.ok .sdot{background:var(--ok)}.sync.ok strong{color:var(--ok)}
.sync.wait{background:var(--warnbg)}.sync.wait .sdot{background:var(--warn);animation:pulso 1.2s ease-in-out infinite}.sync.wait strong{color:var(--warn)}
.sync.err{background:var(--badbg)}.sync.err .sdot{background:var(--bad)}.sync.err strong{color:var(--bad)}
@keyframes pulso{50%{opacity:.35}}
.esync{font-size:12px;font-weight:600;margin-right:8px;padding:1px 8px;border-radius:99px}
.esync.ok{background:var(--okbg);color:var(--ok)}.esync.wait{background:var(--warnbg);color:var(--warn)}
@media (prefers-reduced-motion:reduce){.sync.wait .sdot{animation:none}}
/* Guia "Como usar" */
.tablist{overflow-x:auto;overflow-y:hidden;max-width:100%}
.tablist button{white-space:nowrap;margin-bottom:0}
.guia-intro{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--agua);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.guia-intro p{margin:0}
.passos{list-style:none;counter-reset:passo;padding:0;margin:0;display:flex;flex-direction:column;gap:12px}
.passo{counter-increment:passo;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 18px 18px 66px;position:relative;break-inside:avoid}
.passo::before{content:counter(passo);position:absolute;left:18px;top:16px;width:32px;height:32px;border-radius:50%;background:var(--roxobg);color:var(--roxo);font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center}
.passo h3{margin:0 0 6px;font-size:16px;line-height:1.35;padding-top:4px}
.passo p{margin:0 0 8px}
.passo p:last-child{margin-bottom:0}
.passo ul{margin:6px 0 0;padding-left:18px}
.passo li{margin:4px 0}
.passo .obg{font-size:12px;font-weight:600;color:var(--bad);margin-left:4px}
.passo .ex{display:inline-block;background:var(--surface2);border-radius:6px;padding:0 7px;font-size:13.5px;font-weight:600}
.cores{display:flex;flex-direction:column;gap:6px;margin-top:6px}
.cores>span{display:flex;align-items:baseline;gap:8px}
.cores i{width:10px;height:10px;border-radius:50%;flex:none;transform:translateY(1px)}
.dicas{background:var(--warnbg);border-radius:14px;padding:16px 18px;margin-top:16px}
.dicas h3{margin:0 0 6px;font-size:16px}
.dicas ul{margin:0;padding-left:18px}
.dicas li{margin:4px 0}
.guia-fim{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}
@media (max-width:520px){.passo{padding:16px 14px 16px 56px}.passo::before{left:14px}}
/* Tour guiado */
.tour-dim{position:fixed;inset:0;background:rgba(20,16,35,.55);z-index:9000;display:none}
.tour-spot{position:fixed;z-index:9001;display:none;border-radius:12px;border:3px solid #FFB020;box-shadow:0 0 0 9999px rgba(20,16,35,.55);pointer-events:none;transition:top .2s,left .2s,width .2s,height .2s;animation:tourPulse 1.6s infinite}
.tour-spot::after{content:"";position:absolute;inset:-3px;border-radius:12px;animation:tourRing 1.6s infinite}
@keyframes tourPulse{0%,100%{border-color:#FFB020}50%{border-color:#FFE08A}}
@keyframes tourRing{0%{box-shadow:0 0 0 0 rgba(255,176,32,.75)}100%{box-shadow:0 0 0 16px rgba(255,176,32,0)}}
.tour-tag{position:fixed;z-index:9002;display:none;background:#FFB020;color:#1D1A2E;font-size:12.5px;font-weight:800;padding:4px 10px;border-radius:99px;pointer-events:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.tour-box{position:fixed;z-index:9003;display:none;width:min(370px,calc(100vw - 32px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-top:4px solid #FFB020;border-radius:14px;padding:12px 16px 16px;box-shadow:0 14px 44px rgba(0,0,0,.3)}
.tour-prog{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;font-weight:700;color:var(--muted)}
.tour-x{border:0;background:none;font-size:16px;color:var(--muted);padding:2px 6px;border-radius:6px}
.tour-bar{height:5px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 12px}
.tour-bar i{display:block;height:100%;background:var(--roxo);transition:width .2s}
.tour-box h3{margin:0 0 6px;font-size:17px;line-height:1.3}
.tour-box p{margin:0 0 10px;font-size:14.5px}
.tour-box .tour-hint{background:var(--warnbg);color:var(--warn);font-weight:600;font-size:13px;border-radius:8px;padding:6px 10px}
.tour-acts{display:flex;gap:8px;align-items:center;margin-top:4px}
.tour-cta{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;background:var(--roxobg);border:1px solid var(--roxo);border-radius:14px;padding:16px 18px;margin-bottom:16px}
.tour-cta p{margin:2px 0 0}
.passo .mostrar{float:right;margin:0 0 8px 12px}
@media (max-width:520px){.passo .mostrar{float:none;display:inline-block;margin:0 0 10px}}
@media print{.tour-dim,.tour-spot,.tour-tag,.tour-box{display:none!important}}
@media (prefers-reduced-motion:reduce){.tour-spot,.tour-spot::after{animation:none}.tour-spot{transition:none}}
.gate{min-height:80vh;display:flex;align-items:center;justify-content:center}
.gatebox{background:var(--surface);border:1px solid var(--line);border-top:4px solid var(--roxo);border-radius:14px;padding:28px;width:min(440px,100%)}
.gatebox h1{font-size:22px}
.tabs{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px;border-bottom:1px solid var(--line)}
.tablist{display:flex;gap:4px}
.tablist button{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--muted);border-bottom:3px solid transparent;margin-bottom:-1px}
.tablist button[aria-current="page"]{color:var(--roxo);border-bottom-color:var(--roxo)}
.quem{font-size:13px;color:var(--muted);padding:6px 0}
.quem strong{color:var(--ink)}
.hist{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--agua);border-radius:10px;padding:12px 16px;margin-bottom:10px}
.hist.a-criacao{border-left-color:var(--ok)}.hist.a-exclusao{border-left-color:var(--bad)}.hist.a-edicao{border-left-color:var(--warn)}.hist.a-configuracao{border-left-color:var(--roxo)}
.htag{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--surface2);margin-right:4px}
.a-criacao .htag{background:var(--okbg);color:var(--ok)}.a-exclusao .htag{background:var(--badbg);color:var(--bad)}.a-edicao .htag{background:var(--warnbg);color:var(--warn)}.a-configuracao .htag{background:var(--roxobg);color:var(--roxo)}
.halvo{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.htab{min-width:420px}.htab td{font-size:13.5px;white-space:pre-wrap;overflow-wrap:anywhere}
.htab td.antes{color:var(--bad)}.htab td.depois{color:var(--ok)}
.htab em{color:var(--muted);font-style:italic}
.hdet{margin-top:8px;font-size:13.5px}.hdet summary{cursor:pointer;color:var(--roxo);font-weight:600}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.on{opacity:1}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:22px;width:min(520px,92vw)}
dialog::backdrop{background:rgba(20,16,35,.45)}
dialog .grid{grid-template-columns:1fr 1fr}

/* Calendário */
.cal{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}
.calhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.calhead .mes{font-size:20px;font-weight:800;text-transform:capitalize}
.calnav{display:flex;gap:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-top:12px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.wk,.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.wk div{font-size:12.5px;font-weight:600;color:var(--muted);text-align:center;padding-bottom:4px}
.dcell{border:1px solid var(--line);background:var(--bg);border-radius:10px;min-height:78px;padding:7px 8px;text-align:left;display:flex;flex-direction:column;gap:4px}
.dcell:hover{border-color:var(--roxo)}
.dcell.fora{opacity:.4}
.dcell .n{font-weight:700;font-size:14px}
.dcell.hoje .n{color:var(--roxo)}
.dcell.hoje .n::after{content:" hoje";font-size:11px;font-weight:600}
.dcell[aria-pressed="true"]{background:var(--roxobg);border:2px solid var(--roxo);padding:6px 7px}
.dcell .ms{display:flex;flex-direction:column;gap:3px;margin-top:auto}
.mk{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:600;line-height:1.2}
.mk .dot{width:8px;height:8px}
.daysec-head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.daytitle{font-size:22px;font-weight:800;text-transform:capitalize;margin:0}
@media (max-width:600px){
  .dcell{min-height:54px;padding:5px;align-items:center;text-align:center}
  .dcell[aria-pressed="true"]{padding:4px}
  .dcell .mk .t{display:none}
  .dcell .ms{flex-direction:row;justify-content:center;gap:4px}
  .dcell.hoje .n::after{content:""}
  .wk,.days{gap:4px}
}
@media (max-width:820px){
  .panels{grid-template-columns:1fr}
  .grid{grid-template-columns:1fr 1fr}
  .chain{grid-template-columns:1fr;gap:14px}
  .arrow{width:2px;height:28px;margin:0 0 0 4px;background:linear-gradient(180deg,var(--roxo),var(--agua))}
  .arrow::after{right:-4px;top:auto;bottom:-1px;border:5px solid transparent;border-top:7px solid var(--agua);border-bottom:0}
}
@media (max-width:520px){
  .grid,dialog .grid{grid-template-columns:1fr}
  .f.span2{grid-column:auto}
  .kpis{grid-template-columns:1fr 1fr}
  .edl{grid-template-columns:1fr}
  h1{font-size:23px}
}
@media print{
  .noprint{display:none!important}
  body{background:#fff}
  .entry,.panel,.card,.matrix-wrap,.chain{break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){.toast{transition:none}}
</style>
</head>

const firebaseConfig = {

try {

  const sessoes = collection(loja, "sessoes");
  const historico = collection(loja, "historico");
  // Cada alteração grava o dado e o registro de histórico no mesmo lote: ou os dois entram, ou nenhum entra.
  const comHistorico = (b, h) => { if (h) b.set(doc(historico), Object.assign({}, h, { quando: serverTimestamp() })); };
  const limpar = (reg) => { const r = Object.assign({}, reg, { atualizadoEm: new Date().toISOString() }); delete r._pendente; return r; };
  window.FB = {
    onSessoes: (cb, err) => onSnapshot(sessoes, { includeMetadataChanges: true }, (snap) => cb(
      snap.docs.map((d) => Object.assign(d.data(), { _pendente: d.metadata.hasPendingWrites })),
      { doCache: snap.metadata.fromCache, pendente: snap.metadata.hasPendingWrites }
    ), err),
    onConfig: (cb, err) => onSnapshot(loja, (snap) => cb(snap.exists() ? snap.data() : null), err),
    onHistorico: (cb, err) => onSnapshot(query(historico, orderBy("quando", "desc"), limit(2000)), { includeMetadataChanges: true }, (snap) => cb(
      snap.docs.map((d) => {
        const x = d.data({ serverTimestamps: "estimate" });
        return Object.assign(x, { id: d.id, quandoMs: x.quando && x.quando.toMillis ? x.quando.toMillis() : Date.now(), _pendente: d.metadata.hasPendingWrites });
      })
    ), err),
    setSessao: (reg, hist) => { const b = writeBatch(db); b.set(doc(sessoes, reg.id), limpar(reg)); comHistorico(b, hist); return b.commit(); },
    delSessao: (id, hist) => { const b = writeBatch(db); b.delete(doc(sessoes, id)); comHistorico(b, hist); return b.commit(); },
    setConfig: (config, hist) => { const b = writeBatch(db); b.set(loja, { config: config, atualizadoEm: new Date().toISOString() }, { merge: true }); comHistorico(b, hist); return b.commit(); }
  };
  window.dispatchEvent(new Event("fb-ready"));
} catch (e) {
  window.FB_ERRO = String((e && e.message) || e);
  window.dispatchEvent(new Event("fb-fail"));
}
</script>

function statsCondutor(i){

  var min=0,soma=0;ss.forEach(function(s){min+=minutos(s);soma+=Number(s.nota)||0});

  var treinados=topicos.filter(function(t){return t.n>0}).length;
  var aptos=topicos.filter(function(t){return t.apto}).length;
  return {sessoes:ss.length,horas:fmtHoras(min),media:ss.length?(soma/ss.length):null,treinados:treinados,aptos:aptos,total:topicos.length};
}
function matriz(){
  var mapa={},ordem=[];
  STATE.sessoes.slice().sort(function(a,b){return (a.data+a.inicio).localeCompare(b.data+b.inicio)}).forEach(function(s){
    var k=norm(s.topico);if(!k)return;
    if(!mapa[k]){mapa[k]={nome:s.topico.trim(),st:[{n:0},{n:0}]};ordem.push(k)}

  });
  return ordem.map(function(k){return mapa[k]});
}

  var agora=new Date();
  var doc='<!DOCTYPE html>\n<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Resumo do treinamento '+dataBR+'</title><style>'+css+'</style></head><body><div class="w">'+
    '<div class="top"><h1>Resumo do treinamento da expedição</h1><p class="mut">'+esc(fmtData(selDate))+'</p><div class="meta"><div><span>Loja</span><b>'+esc(cfg.unidade||'–')+'</b></div><div><span>Expedidor (instrutor)</span><b>'+esc(cfg.expedidor||'–')+'</b></div><div><span>Sessões no dia</span><b>'+doDia.length+'</b></div></div></div>'+

function exportCsv(){
  var cab=["Condutor","Dia","Início","Fim","Duração (min)","Tópico","O que foi explicado","Como foi explicado","Detalhe do método","Se saiu bem","Nota","Apto sozinho","Feedback do condutor","Observações do expedidor"];
  var q=function(v){v=String(v==null?"":v);if(/^[=+\-@]/.test(v))v="'"+v;return "\""+v.replace(/"/g,"\"\"")+"\""};
  var linhas=[cab.map(q).join(";")];
  STATE.sessoes.slice().sort(function(a,b){return (a.data+a.inicio).localeCompare(b.data+b.inicio)}).forEach(function(s){
    linhas.push([nomeC(s.condutor),s.data.split("-").reverse().join("/"),s.inicio,s.fim,minutos(s),s.topico,s.explicado,(s.metodos||[]).join(", "),s.comoDetalhe,s.desempenho,s.nota,s.apto?"Sim":"Não",s.feedback,s.obs].map(q).join(";"));
  });
  var csv="\ufeff"+linhas.join("\r\n");var nome="cronograma-treinamento-expedicao.csv";
  var fallback=function(){try{var a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv;charset=utf-8"}));a.download=nome;document.body.appendChild(a);a.click();a.remove()}catch(e){toast("Não foi possível gerar o arquivo neste ambiente.")}};
  if(window.claude&&typeof window.claude.use==="function"){
    window.claude.use("downloads").then(function(dl){
      if(dl&&typeof dl.save==="function"){dl.save({filename:nome,data:csv}).catch(function(e){if(!e||e.code!=="dismissed")toast("Não foi possível baixar o arquivo.")})}
      else fallback();
    }).catch(fallback);
  }else fallback();
}

render();
